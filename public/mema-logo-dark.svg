<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Network Icon: 5 connected nodes representing interconnected financial systems -->
  <g id="network-icon">
    <!-- Connecting lines -->
    <line x1="30" y1="30" x2="22" y2="18" stroke="#00C897" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="30" x2="22" y2="42" stroke="#00C897" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="30" x2="45" y2="22" stroke="#00C897" stroke-width="2" opacity="0.6"/>
    <line x1="30" y1="30" x2="45" y2="38" stroke="#00C897" stroke-width="2" opacity="0.6"/>

    <!-- Outer nodes -->
    <circle cx="22" cy="18" r="5" fill="#00C897" opacity="0.9"/>
    <circle cx="22" cy="42" r="5" fill="#00C897" opacity="0.9"/>
    <circle cx="45" cy="22" r="5" fill="#00C897" opacity="0.9"/>
    <circle cx="45" cy="38" r="5" fill="#00C897" opacity="0.9"/>

    <!-- Central node (larger) -->
    <circle cx="30" cy="30" r="7" fill="#00C897"/>

    <!-- Glow effect on central node -->
    <circle cx="30" cy="30" r="7" fill="#00C897" opacity="0.3"/>
    <circle cx="30" cy="30" r="9" fill="#00C897" opacity="0.1"/>
  </g>

  <!-- MEMA Text in Inter Bold - White for dark backgrounds -->
  <text x="65" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">MEMA</text>
</svg>
