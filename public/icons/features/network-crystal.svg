<svg width="280" height="220" viewBox="0 0 280 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified network crystal / hexagonal connection visual -->
  <g opacity="0.15">
    <path d="M140 20L200 60L200 140L140 180L80 140L80 60L140 20Z" stroke="#00C897" stroke-width="2"/>
    <path d="M140 40L180 65L180 135L140 160L100 135L100 65L140 40Z" stroke="#00C897" stroke-width="2"/>
  </g>

  <!-- Main hexagonal structure -->
  <path d="M140 50L190 80L190 140L140 170L90 140L90 80L140 50Z" fill="#00C897" opacity="0.2" stroke="#00C897" stroke-width="3"/>

  <!-- Connection nodes -->
  <circle cx="140" cy="50" r="8" fill="#00C897"/>
  <circle cx="190" cy="80" r="8" fill="#00C897"/>
  <circle cx="190" cy="140" r="8" fill="#00C897"/>
  <circle cx="140" cy="170" r="8" fill="#00C897"/>
  <circle cx="90" cy="140" r="8" fill="#00C897"/>
  <circle cx="90" cy="80" r="8" fill="#00C897"/>

  <!-- Center hub -->
  <circle cx="140" cy="110" r="20" fill="#00C897"/>
  <circle cx="140" cy="110" r="15" fill="#00FFB3" opacity="0.8"/>
  <circle cx="140" cy="110" r="10" fill="#FFFFFF" opacity="0.6"/>

  <!-- Connection lines to center -->
  <line x1="140" y1="50" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="80" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
  <line x1="190" y1="140" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
  <line x1="140" y1="170" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="140" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
  <line x1="90" y1="80" x2="140" y2="110" stroke="#00C897" stroke-width="2" opacity="0.6"/>
</svg>
