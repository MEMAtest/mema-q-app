<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F3F0FF;stop-opacity:0.6" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="120" r="100" fill="url(#heroGradient)"/>

  <!-- Central shield with compliance theme -->
  <g transform="translate(200, 120)" filter="url(#softGlow)">
    <!-- Shield outline -->
    <path d="M0,-60 L45,-45 L45,-10 C45,20 30,40 0,60 C-30,40 -45,20 -45,-10 L-45,-45 Z"
          fill="#ffffff" stroke="#3B82F6" stroke-width="3"/>

    <!-- Inner shield detail -->
    <path d="M0,-50 L35,-37 L35,-10 C35,15 24,30 0,45 C-24,30 -35,15 -35,-10 L-35,-37 Z"
          fill="#EFF6FF" stroke="#7C3AED" stroke-width="2" opacity="0.8"/>

    <!-- Checkmark for compliance -->
    <path d="M-15,0 L-5,12 L20,-18"
          stroke="#00C897" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Small compliance badge at top -->
    <circle cx="0" cy="-55" r="8" fill="#00C897"/>
    <text x="0" y="-51" font-family="Arial, sans-serif" font-size="10" font-weight="bold"
          fill="white" text-anchor="middle">✓</text>
  </g>

  <!-- Floating regulatory documents -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="70" height="50" rx="6" fill="white" stroke="#7C3AED" stroke-width="2.5" opacity="0.9"/>
    <line x1="10" y1="12" x2="45" y2="12" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="55" y2="22" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="32" x2="40" y2="32" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <text x="8" y="45" font-family="Arial, sans-serif" font-size="8" fill="#6B7280" font-weight="600">PERG 8</text>
  </g>

  <g transform="translate(260, 140)">
    <rect x="0" y="0" width="75" height="55" rx="6" fill="white" stroke="#00C897" stroke-width="2.5" opacity="0.9"/>
    <circle cx="15" cy="15" r="5" fill="#00C897"/>
    <line x1="25" y1="15" x2="60" y2="15" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="28" r="5" fill="#7C3AED"/>
    <line x1="25" y1="28" x2="55" y2="28" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
    <circle cx="15" cy="41" r="5" fill="#3B82F6"/>
    <line x1="25" y1="41" x2="50" y2="41" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- FCA logo representation -->
  <g transform="translate(290, 60)">
    <circle cx="0" cy="0" r="25" fill="#ffffff" stroke="#3B82F6" stroke-width="2.5"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="16" font-weight="bold"
          fill="#3B82F6" text-anchor="middle">FCA</text>
  </g>

  <!-- Connecting lines showing compliance flow -->
  <line x1="115" y1="105" x2="165" y2="95" stroke="#E0E7FF" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="235" y1="125" x2="275" y2="150" stroke="#E0E7FF" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="265" y1="85" x2="220" y2="90" stroke="#E0E7FF" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>

  <!-- Status indicators -->
  <g transform="translate(100, 170)">
    <rect x="0" y="0" width="50" height="22" rx="11" fill="#00C897" opacity="0.15" stroke="#00C897" stroke-width="2"/>
    <circle cx="12" cy="11" r="4" fill="#00C897"/>
    <text x="20" y="15" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#00C897">LIVE</text>
  </g>

  <!-- Sparkles for emphasis -->
  <path d="M60 50 L62 56 L68 58 L62 60 L60 66 L58 60 L52 58 L58 56 Z" fill="#00C897" opacity="0.7"/>
  <path d="M340 100 L341 104 L345 105 L341 106 L340 110 L339 106 L335 105 L339 104 Z" fill="#7C3AED" opacity="0.7"/>
  <path d="M150 40 L151 43 L154 44 L151 45 L150 48 L149 45 L146 44 L149 43 Z" fill="#3B82F6" opacity="0.7"/>
  <path d="M320 180 L321 183 L324 184 L321 185 L320 188 L319 185 L316 184 L319 183 Z" fill="#00C897" opacity="0.7"/>
</svg>
